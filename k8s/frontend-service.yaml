# ─────────────────────────────────────────────────────────────────
# Frontend Service — AWS Network Load Balancer
#
# type: LoadBalancer creates an AWS NLB automatically.
# The NLB gets a public DNS name — this is the entry point from
# the internet as shown in the architecture diagram.
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
