# ─────────────────────────────────────────────────────────────────
# API Gateway Service — ClusterIP (internal only)
#
# Only reachable inside the cluster.
# Frontend nginx proxies /api/ → http://api-gateway:8000/
# The service name MUST be "api-gateway" to match nginx.conf.
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
