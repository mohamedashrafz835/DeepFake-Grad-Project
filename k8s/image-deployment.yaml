# ─────────────────────────────────────────────────────────────────
# Image Service Deployment
# CNN + Grad-CAM deepfake image detection — FastAPI on port 8000
# Replicas: 1 per node (ML model is CPU/memory heavy)
#
# MODEL_S3_PATH env var → set by the Lambda-triggered CI/CD workflow
# when a new model is uploaded to S3. Update this value after each
# model deployment.
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  labels:
    app: image-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1          # allow 1 unavailable during model rollout
  template:
    metadata:
      labels:
        app: image-service
    spec:
      containers:
        - name: image-service
          image: 835835/m:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_S3_PATH
              # Update to point to the latest model version, e.g.:
              # s3://ml-models-deepfake-<ACCOUNT_ID>/image-service/v1/model.pth
              value: "s3://ml-models-deepfake-<AWS_ACCOUNT_ID>/image-service/v1/model.pth"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # Model loading takes time — give it 3 minutes before routing traffic
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 200
            periodSeconds: 30
            failureThreshold: 3
